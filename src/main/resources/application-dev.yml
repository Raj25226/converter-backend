# Local values for every environment placeholder in application.yml.
# Real environment variables and command-line arguments take precedence.
# Credentials below are development-only; never use this profile in production.

# Server and uploads
SERVER_PORT: 8080
SERVER_ERROR_INCLUDE_MESSAGE: "never"
SERVER_ERROR_INCLUDE_BINDING_ERRORS: "never"
SPRING_TASK_EXECUTION_POOL_CORE_SIZE: 2
SPRING_TASK_EXECUTION_POOL_MAX_SIZE: 4
SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY: 100
SPRING_SERVLET_MULTIPART_ENABLED: true
MAX_FILE_SIZE_MB: 50
MAX_REQUEST_SIZE_MB: 55

# Database
DATABASE_URL: "jdbc:postgresql://localhost:5432/unimorpher"
DB_DRIVER: "org.postgresql.Driver"
DB_USERNAME: "admin"
DB_PASSWORD: "admin"
SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 30000
SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 600000
SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 1800000
SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
SPRING_JPA_SHOW_SQL: false
SPRING_JPA_OPEN_IN_VIEW: false
SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: 25
SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS: true
SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES: true

# Email
SMTP_HOST: "localhost"
SMTP_PORT: 1025
SMTP_USERNAME: ""
SMTP_PASSWORD: ""
SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: false
SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: false
SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: false
SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: 10000
SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: 10000
SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: 10000
MAIL_FROM: "noreply@fileconvert.pro"

# Security
JWT_SECRET: "local-development-only-signing-key-change-before-deployment-0123456789"
JWT_EXPIRY_DAYS: 7
GOOGLE_CLIENT_ID: ""
AUTH_PASSWORD_STRENGTH: 12
AUTH_VERIFICATION_EXPIRY_HOURS: 24
AUTH_RESET_EXPIRY_HOURS: 1
AUTH_REQUESTS_PER_WINDOW: 20
AUTH_TOKEN_CLEANUP_INTERVAL_MS: 3600000

# Application URLs and CORS
CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
CORS_ALLOWED_HEADERS: "*"
CORS_EXPOSED_HEADERS: "Authorization,Content-Disposition,X-Request-ID"
CORS_ALLOW_CREDENTIALS: true
CORS_MAX_AGE_SECONDS: 3600
CORS_ALLOWED_ORIGINS: "http://localhost:3000"
FRONTEND_URL: "http://localhost:3000"
BACKEND_URL: "http://localhost:8080"

# File storage
FILE_HISTORY_RETENTION_DAYS: 30
FILE_ORPHAN_GRACE_MINUTES: 10
FILE_ORPHAN_CLEANUP_INTERVAL_MS: 3600000
UPLOAD_DIR: "./var/uploads"
OUTPUT_DIR: "./var/outputs"
FILE_EXPIRY_MINUTES: 30
FILE_CLEANUP_INTERVAL_MS: 60000

# Conversion
CONVERSION_MAX_PDF_TABLE_COLUMNS: 100
CONVERSION_MAX_PDF_TABLE_ROWS: 100000
CONVERSION_TABLE_MAX_COLUMN_WIDTH: 60
CONVERSION_TABLE_MIN_COLUMN_WIDTH: 12
CONVERSION_TABLE_COLUMN_PADDING: 2
CONVERSION_TABLE_LINE_TOLERANCE: 2.5
CONVERSION_TABLE_MIN_SPACE_WIDTH: 2
CONVERSION_TABLE_MIN_COLUMN_GAP: 12
CONVERSION_TABLE_COLUMN_GAP_FACTOR: 2.5
CONVERSION_TABLE_WORD_GAP_FACTOR: 0.6
CONVERSION_MAX_OFFICE_RELATIONSHIPS_MB: 1
CONVERSION_NATIVE_DIAGNOSTIC_BYTES: 16384
CONVERSION_NATIVE_POLL_INTERVAL_MS: 100
CONVERSION_NATIVE_DRAIN_TIMEOUT_MS: 1000
CONVERSION_NATIVE_TERMINATION_TIMEOUT_SECONDS: 2
CONVERSION_NATIVE_PROBE_TIMEOUT_MS: 5000
CONVERSION_NATIVE_HEALTH_CACHE_SECONDS: 60
CONVERSION_OFFICE_VCL_PLUGIN: "svp"
CONVERSION_OFFICE_MIN_INFLATE_RATIO: 0.001
CONVERSION_OFFICE_MAX_ENTRY_MB: 64
CONVERSION_OFFICE_MAX_TEXT_MB: 10
CONVERSION_JPEG_QUALITY: 92
CONVERSION_WEBP_QUALITY: 90
CONVERSION_COMPRESSION_JPEG_QUALITY: 75
CONVERSION_IMAGE_MEMORY_LIMIT: "128MiB"
CONVERSION_IMAGE_MAP_LIMIT: "256MiB"
CONVERSION_IMAGE_DISK_LIMIT: "256MiB"
CONVERSION_NATIVE_THREADS: 2
CONVERSION_FILTER_THREADS: 1
CONVERSION_AUDIO_BITRATE: "192k"
CONVERSION_AUDIO_SAMPLE_RATE: 44100
CONVERSION_GIF_DURATION_SECONDS: 30
CONVERSION_GIF_FRAMES_PER_SECOND: 10
CONVERSION_GIF_MAX_DIMENSION: 480
CONVERSION_FFMPEG_MAX_ALLOCATION_BYTES: 268435456
CONVERSION_ARCHIVE_MAX_NAME_LENGTH: 512
CONVERSION_DOCUMENT_FONT_SIZE: 11
CONVERSION_DOCUMENT_FONT_FAMILY: "Noto Sans"
CONVERSION_DOCUMENT_PARAGRAPH_SPACING: 120
CONVERSION_MAX_CONCURRENT: 2
CONVERSION_TIMEOUT_SECONDS: 120
CONVERSION_MAX_OUTPUT_MB: 200
CONVERSION_MAX_PDF_STYLES: 1024
CONVERSION_MAX_PDF_PAGES: 500
CONVERSION_MAX_TEXT_CHARACTERS: 500000
CONVERSION_MAX_IMAGE_PIXELS: 25000000
CONVERSION_MAX_IMAGE_DIMENSION: 10000
CONVERSION_MAX_SPREADSHEET_CELLS: 200000
CONVERSION_MAX_OFFICE_EXPANDED_MB: 256
CONVERSION_MAX_ZIP_ENTRIES: 1000
CONVERSION_MAX_ZIP_ENTRY_MB: 100
CONVERSION_MAX_ZIP_EXPANDED_MB: 500
CONVERSION_NATIVE_HEALTH_ENABLED: false
CONVERSION_GUEST_DAILY_LIMIT: 100
CONVERSION_USER_DAILY_LIMIT: 100

# Native tools
LIBREOFFICE_BINARY: "soffice"
IMAGE_SRGB_PROFILE: ""
IMAGEMAGICK_BINARY: "magick"
FFMPEG_BINARY: "ffmpeg"
FFPROBE_BINARY: "ffprobe"

# Logging
LOGGING_LEVEL_COM_CONVERTER: "DEBUG"
LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "WARN"
LOGGING_LEVEL_ORG_HIBERNATE_SQL: "WARN"
LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "WARN"
LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"

# Health
MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: true
MANAGEMENT_HEALTH_MAIL_ENABLED: false

# Analytics and quotas
ANALYTICS_SESSION_CLEANUP_INTERVAL_MS: 86400000
ANALYTICS_MAX_TRACKED_SESSIONS: 100000
ANALYTICS_REQUESTS_PER_WINDOW: 30
QUOTA_REQUEST_WINDOW_SECONDS: 60
QUOTA_RETENTION_DAYS: 2
QUOTA_CLEANUP_INTERVAL_MS: 3600000

# Administration
ADMIN_MAX_PAGE_SIZE: 100
ADMIN_DEFAULT_PAGE_SIZE: 20
ADMIN_DEFAULT_OFFSET: 0

# Optional slower PDF round-trip verification: structural or deep.
CONVERSION_PDF_VERIFICATION: "structural"

FILE_CLEANUP_BATCH_SIZE: 100
FILE_CLEANUP_MAX_BATCHES: 10

# Background conversion jobs.
CONVERSION_JOBS_ENABLED: true
CONVERSION_JOBS_MAX_PENDING: 20
CONVERSION_JOBS_RETENTION_MINUTES: 60
CONVERSION_JOBS_QUEUE_TIMEOUT_SECONDS: 900
CONVERSION_JOBS_UPLOAD_TIMEOUT_SECONDS: 300
CONVERSION_JOBS_POLL_INTERVAL_MS: 1000
CONVERSION_JOBS_MAINTENANCE_INTERVAL_MS: 10000

# Feature flags: defaults when no database override exists.
FEATURE_FLAGS_SOURCE: database
FEATURE_LOGIN: true
FEATURE_SIGNUP: true
FEATURE_GOOGLE_OAUTH: true
FEATURE_EMAIL_VERIFICATION: true
FEATURE_PASSWORD_RESET: true
FEATURE_PROFILE: true
FEATURE_PASSWORD_CHANGE: true
FEATURE_HISTORY: true
FEATURE_ANALYTICS_TRACKING: true
FEATURE_ANALYTICS_DASHBOARD: true
FEATURE_DOWNLOADS: true
FEATURE_BACKGROUND_JOBS: true
FEATURE_CONVERSIONS: true
FEATURE_CONVERSION_PDF_TO_WORD: true
FEATURE_CONVERSION_WORD_TO_PDF: true
FEATURE_CONVERSION_PDF_TO_EXCEL: true
FEATURE_CONVERSION_EXCEL_TO_PDF: true
FEATURE_CONVERSION_PPT_TO_PDF: true
FEATURE_CONVERSION_JPG_TO_PNG: true
FEATURE_CONVERSION_PNG_TO_JPG: true
FEATURE_CONVERSION_JPG_TO_WEBP: true
FEATURE_CONVERSION_WEBP_TO_PNG: true
FEATURE_CONVERSION_HEIC_TO_JPG: true
FEATURE_CONVERSION_MP4_TO_MP3: true
FEATURE_CONVERSION_MP4_TO_GIF: true
FEATURE_CONVERSION_WAV_TO_MP3: true
FEATURE_CONVERSION_ZIP_EXTRACT: true
FEATURE_CONVERSION_FILE_COMPRESS: true
