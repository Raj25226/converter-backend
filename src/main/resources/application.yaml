server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  # ── Multipart upload limits ────────────────────────────────────────────────
  # ✅ Must be under spring.servlet.multipart — NOT server.servlet.multipart
  # When placed under server.*, Spring Boot ignores it and defaults to 1MB,
  # causing MaxUploadSizeExceededException for any file larger than 1MB.
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://trolley.proxy.rlwy.net:44659/railway?sslmode=require}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:IouYWODYzKDbtrPGnamLHEZjTuUplywY}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true


  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:unimorpher@gmail.com}
    password: ${SMTP_PASSWORD:upda vdrb dyxj wayt}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:Z1Z3dHNjZkM1YVZKcTg2Z2ZpN3ZKcW1KQ2l2bVd5dE1OZkpQY1JYcXJxU29nQ1hJRW5hN0Npb1E=}
  expiration-days: ${JWT_EXPIRY_DAYS:7}

# ── Google OAuth ───────────────────────────────────────────────────────────────
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# ── CORS ───────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── File Storage ───────────────────────────────────────────────────────────────
file:
  upload-dir: ${UPLOAD_DIR:/tmp/fileconvert/uploads}
  output-dir: ${OUTPUT_DIR:/tmp/fileconvert/outputs}
  max-size-mb: ${MAX_FILE_SIZE_MB:50}
  expiry-minutes: ${FILE_EXPIRY_MINUTES:30}
  cleanup-interval-ms: 60000

# ── App ────────────────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-download-url: ${BACKEND_URL:http://localhost:8080}/api/download/

# ── Conversion Limits ──────────────────────────────────────────────────────────
conversion:
  guest-daily-limit: ${CONVERSION_GUEST_DAILY_LIMIT:5}
  user-daily-limit: ${CONVERSION_USER_DAILY_LIMIT:15}

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    com.converter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"