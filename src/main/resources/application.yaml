server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/converter}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# JWT
jwt:
  secret: ${JWT_SECRET:change-this-secret-to-a-very-long-random-string-at-least-64-chars}
  expiration-days: ${JWT_EXPIRY_DAYS:7}

# Google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# File Storage
file:
  upload-dir: ${UPLOAD_DIR:/tmp/fileconvert/uploads}
  output-dir: ${OUTPUT_DIR:/tmp/fileconvert/outputs}
  max-size-mb: ${MAX_FILE_SIZE_MB:50}
  expiry-minutes: ${FILE_EXPIRY_MINUTES:30}
  cleanup-interval-ms: 60000

# App
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-download-url: ${BACKEND_URL:http://localhost:8080}/api/download/

# Conversion limits
conversion:
  guest-daily-limit: 2
  user-daily-limit: 10

# Logging
logging:
  level:
    com.converter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"