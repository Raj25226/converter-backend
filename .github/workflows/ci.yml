name: Backend verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: converter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B verify
        env:
          QUOTA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/converter_test
          QUOTA_TEST_DATABASE_USER: postgres
          QUOTA_TEST_DATABASE_PASSWORD: test-only-password
      - run: docker build -t converter-backend:ci .
