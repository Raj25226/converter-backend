name: Backend verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: converter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-draw fonts-noto-core fonts-noto-cjk fonts-liberation2 icc-profiles-free libheif-plugin-libde265
      - run: sh mvnw -B verify
        env:
          CONVERSION_SMOKE_FIXTURES: /tmp/converter-smoke-fixtures
          IMAGEMAGICK_BINARY: convert
          QUOTA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/converter_test
          QUOTA_TEST_DATABASE_USER: postgres
          QUOTA_TEST_DATABASE_PASSWORD: test-only-password
      - name: Audit Maven dependencies
        run: |
          sh mvnw -B dependency:list -DoutputFile=target/dependencies-audit.txt
          python3 scripts/audit-dependencies.py target/dependencies-audit.txt
      - run: docker build -t converter-backend:ci .
