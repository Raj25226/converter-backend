services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fileconvert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fileconvert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fileconvert-backend
    restart: unless-stopped
    mem_limit: "${BACKEND_MEMORY_LIMIT:-2g}"
    pids_limit: 256
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fileconvert
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRY_DAYS: ${JWT_EXPIRY_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8088}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: 172\.30\.0\.2
      UPLOAD_DIR: /app/uploads
      OUTPUT_DIR: /app/outputs
      FILE_EXPIRY_MINUTES: ${FILE_EXPIRY_MINUTES:-30}
      CONVERSION_MAX_CONCURRENT: ${CONVERSION_MAX_CONCURRENT:-2}
      CONVERSION_TIMEOUT_SECONDS: ${CONVERSION_TIMEOUT_SECONDS:-120}
      CONVERSION_MAX_OUTPUT_MB: ${CONVERSION_MAX_OUTPUT_MB:-200}
      CONVERSION_PDF_VERIFICATION: ${CONVERSION_PDF_VERIFICATION:-structural}
      FILE_CLEANUP_BATCH_SIZE: ${FILE_CLEANUP_BATCH_SIZE:-100}
      FILE_CLEANUP_MAX_BATCHES: ${FILE_CLEANUP_MAX_BATCHES:-10}
      CONVERSION_JOBS_ENABLED: ${CONVERSION_JOBS_ENABLED:-true}
      CONVERSION_JOBS_MAX_PENDING: ${CONVERSION_JOBS_MAX_PENDING:-20}
      CONVERSION_JOBS_RETENTION_MINUTES: ${CONVERSION_JOBS_RETENTION_MINUTES:-60}
      CONVERSION_JOBS_QUEUE_TIMEOUT_SECONDS: ${CONVERSION_JOBS_QUEUE_TIMEOUT_SECONDS:-900}
      CONVERSION_JOBS_UPLOAD_TIMEOUT_SECONDS: ${CONVERSION_JOBS_UPLOAD_TIMEOUT_SECONDS:-300}
      CONVERSION_JOBS_POLL_INTERVAL_MS: ${CONVERSION_JOBS_POLL_INTERVAL_MS:-1000}
      CONVERSION_JOBS_MAINTENANCE_INTERVAL_MS: ${CONVERSION_JOBS_MAINTENANCE_INTERVAL_MS:-10000}
    networks:
      default:
        ipv4_address: 172.30.0.3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ../converter-frontend
      args:
        API_URL: http://backend:8080
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:8088}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8088:80"
    networks:
      default:
        ipv4_address: 172.30.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:
  uploads:
  outputs: